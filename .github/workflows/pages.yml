name: Publicar Presupuest-Arg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar sitio y descargar librerías (para uso sin internet)
        run: |
          mkdir -p site/vendor site/icons
          cp index.html sw.js manifest.webmanifest site/
          cp icons/*.png site/icons/
          curl -fsSL https://cdn.tailwindcss.com -o site/vendor/tailwind.js
          curl -fsSL https://unpkg.com/lucide@latest -o site/vendor/lucide.min.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
